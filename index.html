<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f76300">
  <title>Trivia: unirse</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="center-page">
  <main class="join-card">
    <h1 class="logo">Trivia</h1>
    <form id="join-form" novalidate>
      <label for="pin">PIN de la partida</label>
      <input id="pin" name="pin" class="input-big input-pin" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" autocomplete="off" placeholder="000000" required>
      <label for="nick">Tu apodo</label>
      <input id="nick" name="nick" class="input-big" maxlength="20" autocomplete="nickname"
             placeholder="Escribe tu apodo" required>
      <button id="join-button" class="btn btn-primary btn-block" type="submit">Entrar</button>
      <p id="join-status" class="status-text" role="alert"></p>
    </form>
    <a class="subtle-link" href="host.html">Crear partida</a>
  </main>
  <script type="module" src="js/join.js"></script>
</body>
</html>
